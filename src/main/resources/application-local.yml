spring:
  config:
    activate:
      on-profile: local
  ai:
    ollama:
      base-url: ${EMBEDDING_BASE_URL:http://10.100.102.12:11434}
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}
    openai:
      base-url: ${CHAT_BASE_URL:http://localhost:11434/v1}
      api-key: ${CHAT_API_KEY:dummy}
      chat:
        options:
          model: ${CHAT_MODEL:qwen2.5:7b-instruct-q4_K_M}

app:
  chat:
    provider: ${CHAT_PROVIDER:openai_compatible}
    timeout-seconds: ${CHAT_TIMEOUT_SECONDS:240}
    max-tokens: ${CHAT_MAX_TOKENS:400}
    think: ${CHAT_THINK:false}
  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}
    base-url: ${EMBEDDING_BASE_URL:http://10.100.102.12:11434}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
    concurrency: ${EMBEDDING_CONCURRENCY:8}
    cache-enabled: ${EMBEDDING_CACHE_ENABLED:true}
