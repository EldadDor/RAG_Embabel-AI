spring:
  config:
    activate:
      on-profile: work
  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        api-key: ${AZURE_OPENAI_API_KEY:}
        chat:
          options:
            model: ${CHAT_MODEL}
        embedding:
          options:
            model: ${EMBEDDING_MODEL}

app:
  chat:
    provider: ${CHAT_PROVIDER:azure_openai}
    model: ${CHAT_MODEL}
    timeout-seconds: ${CHAT_TIMEOUT_SECONDS:240}
    max-tokens: ${CHAT_MAX_TOKENS:400}
    think: ${CHAT_THINK:false}
  embedding:
    provider: ${EMBEDDING_PROVIDER:azure_openai}
    model: ${EMBEDDING_MODEL}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
    concurrency: ${EMBEDDING_CONCURRENCY:8}
    cache-enabled: ${EMBEDDING_CACHE_ENABLED:true}
