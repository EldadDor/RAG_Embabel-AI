global:
  scrape_interval: 10s

scrape_configs:
  - job_name: rag-embabel-ai
    metrics_path: /actuator/prometheus
    static_configs:
      # The Kotlin service runs on the workstation, not inside the laptop's Docker host.
      - targets: [10.100.102.11:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
